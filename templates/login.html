{% extends "base.html" %}
{% block extra_css%}
<link rel="stylesheet" href="../static/css/for_login.css">
{% endblock %}
{% block title%}Login{% endblock %}
{% block content %}
<section class="auth">

    <div class="card">
        <div class="image"><img src="../static/assets/logo-removebg-preview.png" alt="logo" height="20%" width="40%">
        </div>
        <h1 class="title">Welcome Back</h1>
        <p class="subtitle">Sign in to continue your adventure</p>

        <form method="post" action="/login">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" placeholder="Enter email" id="email" name="user_email" required>
            </div>

            <div class="input-group">
                <label for="pass">Password</label>
                <input type="password" placeholder="Enter password" id="pass" name="user_password" required>
            </div>

            <button type="submit" class="login-btn">
                <div class="icon" style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <img src="../static/assets/login.svg" alt="In">Login
                </div>
            </button>
        </form>

        <p class="signup-text" style="margin-top: 30px;">New to SummitQuest? <a href="/register">Create account</a></p>
    </div>

</section>

{% endblock %}
